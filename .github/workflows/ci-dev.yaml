name: Dev branch tests

on:
  pull_request:
    branches: [v5.1.2-dev]
    types: [opened, synchronize, reopened]
  # The upstream suite includes external-fixture tests; run it explicitly when needed.
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run all internal and runtime tests
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: File output tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential bison flex libcurl4-openssl-dev libpq-dev \
            libsasl2-dev libssl-dev libsystemd-dev libyaml-dev pkg-config zlib1g-dev
      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2.2.0
        with:
          cmake-version: '3.31.6'
      - name: Configure tests
        env:
          FULL_SUITE: ${{ inputs.full_suite }}
        run: |
          internal=Off
          if [ "$FULL_SUITE" = true ]; then
            internal=On
          fi
          cmake -S . -B build \
            -DFLB_CONFIG_YAML=On \
            -DFLB_TESTS_INTERNAL="$internal" \
            -DFLB_TESTS_RUNTIME=On
      - name: Build file output tests
        if: ${{ !inputs.full_suite }}
        run: cmake --build build --parallel 4 --target flb-rt-out_file flb-rt-out_file_rotation
      - name: Run file output tests
        if: ${{ !inputs.full_suite }}
        run: ctest --test-dir build -R '^flb-rt-out_file(_rotation)?$' --output-on-failure --timeout 300
      - name: Build full suite
        if: ${{ inputs.full_suite }}
        run: cmake --build build --parallel 4
      - name: Run full suite
        if: ${{ inputs.full_suite }}
        run: ctest --test-dir build --output-on-failure --timeout 300
